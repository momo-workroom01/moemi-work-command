<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf2ff"><title>もえみの仕事司令室 試作1号</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf2ff;color:#18335e;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}.wrap{max-width:700px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0}p{line-height:1.5}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #17345c10}button{border:0;background:#2864d8;color:white;padding:12px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#e4ebfa;color:#18335e}button:disabled{opacity:.4}input,select{width:100%;padding:11px;border:1px solid #c4d1e5;border-radius:9px;font-size:16px;margin:6px 0 12px}label{font-size:13px;font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.row button{flex:1}.muted{color:#657897;font-size:13px}.hidden{display:none}.task{border-left:6px solid #5a8de4}.task.done{border-left-color:#38a17a}.badge{display:inline-block;background:#eaf2ff;padding:4px 8px;border-radius:8px;font-size:12px}.danger{background:#fff2ed;color:#aa412c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{text-align:center;margin:0;padding:12px 5px}.stats strong{display:block;font-size:24px}small{font-size:12px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1;min-width:72px}progress{width:100%;height:17px;accent-color:#2864d8}footer{margin:20px 0;color:#657897;font-size:12px}</style></head><body><main class="wrap"><div class="muted">PERSONAL PROTOTYPE · v0.1</div><h1>🌼 もえみの仕事司令室</h1><p class="muted">個人端末用の試作品。顧客名・契約情報などは入力しないでね。</p><div class="tabs"><button onclick="show('morning')">朝</button><button onclick="show('work')">作業中</button><button onclick="show('list')">時間割</button></div><section id="morning"><h2>☀️ 今日の仕事</h2><div class="stats"><div class="card"><strong id="total">0</strong><small>今日の予定</small></div><div class="card"><strong id="unfinished">0</strong><small>未完了</small></div><div class="card"><strong id="due">0</strong><small>締切間近</small></div></div><div class="card"><h3>次の仕事</h3><p id="next">予定なし</p><button onclick="show('work')">作業画面へ →</button></div></section><section id="work" class="hidden"><h2>▶ 今の仕事</h2><div class="card"><span class="badge" id="status">開始前</span><h2 id="current">仕事を登録してね</h2><p class="muted" id="hours"></p><progress id="bar" max="100" value="0"></progress><p class="muted">予定時間の経過率（現在時刻基準）</p><div class="buttons"><button id="start" onclick="change('running')">開始・再開</button><button class="secondary" id="pause" onclick="change('paused')">中断</button><button id="finish" onclick="change('done')">完了</button></div><p class="muted" id="actual"></p></div></section><section id="list" class="hidden"><h2>📅 予定一覧</h2><div id="tasks"></div><div class="card"><h3 id="formtitle">＋ 予定を追加</h3><form id="form"><label>仕事名（架空の内容で）</label><input id="name" maxlength="60" required placeholder="例：見積書の作成"><label>予定日</label><input id="date" type="date" required><div class="row"><div style="flex:1"><label>開始</label><input id="from" type="time" value="09:00" required></div><div style="flex:1"><label>終了</label><input id="to" type="time" value="10:00" required></div></div><label>締切</label><select id="deadline"><option value="none">指定なし</option><option value="today">今日中</option><option value="tomorrow">明日中</option><option value="week">今週中</option><option value="specific">日時指定</option></select><input id="dueDate" type="datetime-local" class="hidden"><div class="buttons"><button type="submit">保存する</button><button type="button" class="secondary" onclick="resetForm()">入力をクリア</button></div></form></div></section><footer>データはこのブラウザ内にのみ保存。別端末には同期されません。ブラウザのデータを消すと予定も消えます。通知・音声・自動調整は未実装です。</footer></main><script>const KEY='moemi-command-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}let selected=null,editing=null;const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};$('date').value=today();function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function show(id){['morning','work','list'].forEach(x=>$(x).classList.toggle('hidden',x!==id));render()}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function active(){return data.find(x=>x.id===selected)||data.find(x=>x.status==='running')||data.find(x=>x.status==='paused')||data.find(x=>x.status!=='done')||data[0]}function deadlineText(t){return ({none:'締切なし',today:'今日中',tomorrow:'明日中',week:'今週中',specific:'日時指定'})[t.deadline]||'締切なし'}function render(){data.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));let now=new Date(),d=today(),todayTasks=data.filter(x=>x.date===d);$('total').textContent=todayTasks.length;$('unfinished').textContent=data.filter(x=>x.status!=='done').length;$('due').textContent=data.filter(x=>x.status!=='done'&&x.deadline!=='none').length;let t=active();$('next').textContent=t?`${t.date} ${t.from}　${t.name}`:'予定なし';$('current').textContent=t?.name||'仕事を登録してね';$('hours').textContent=t?`${t.date}　${t.from}〜${t.to}`:'';$('status').textContent=t?({ready:'開始前',running:'作業中',paused:'中断中',done:'完了'})[t.status]:'予定なし';let pct=0;if(t){let a=new Date(t.date+'T'+t.from),b=new Date(t.date+'T'+t.to);pct=Math.max(0,Math.min(100,Math.round((now-a)/(b-a)*100)||0))}$('bar').value=pct;$('start').disabled=!t||t.status==='running'||t.status==='done';$('pause').disabled=!t||t.status!=='running';$('finish').disabled=!t||t.status==='done';$('actual').textContent=t?`開始記録：${t.started||'未記録'} ／ 完了記録：${t.finished||'未記録'}`:'';$('tasks').innerHTML=data.length?data.map(x=>`<div class="card task ${x.status==='done'?'done':''}"><div class="row"><strong>${safe(x.name)}</strong><span class="badge">${x.status==='done'?'完了':deadlineText(x)}</span></div><p class="muted">${safe(x.date)} ${safe(x.from)}〜${safe(x.to)} ${x.deadline==='specific'&&x.dueDate?'／期限 '+safe(x.dueDate.replace('T',' ')):''}</p><div class="buttons"><button class="secondary" onclick="selectTask('${x.id}')">作業画面</button><button class="secondary" onclick="editTask('${x.id}')">編集</button><button class="secondary danger" onclick="deleteTask('${x.id}')">削除</button></div></div>`).join(''):'<div class="card muted">予定はまだありません。下から登録してね。</div>'}function selectTask(id){selected=id;show('work')}function change(status){let t=active();if(!t)return;const stamp=new Date().toLocaleString('ja-JP');if(status==='running'&&!t.started)t.started=stamp;if(status==='done')t.finished=stamp;t.status=status;selected=t.id;persist()}function resetForm(){editing=null;$('form').reset();$('date').value=today();$('dueDate').classList.add('hidden');$('formtitle').textContent='＋ 予定を追加'}function editTask(id){let t=data.find(x=>x.id===id);if(!t)return;editing=id;['name','date','from','to','deadline','dueDate'].forEach(k=>$(k).value=t[k]|| (k==='deadline'?'none':''));$('dueDate').classList.toggle('hidden',t.deadline!=='specific');$('formtitle').textContent='予定を編集';show('list');$('form').scrollIntoView({behavior:'smooth'})}function deleteTask(id){if(!confirm('この予定を削除する？'))return;data=data.filter(x=>x.id!==id);if(selected===id)selected=null;persist()}$('deadline').addEventListener('change',()=>{$('dueDate').classList.toggle('hidden',$('deadline').value!=='specific')});$('form').addEventListener('submit',e=>{e.preventDefault();if($('to').value<=$('from').value){alert('終了時刻は開始時刻より後にしてね');return}if($('deadline').value==='specific'&&!$('dueDate').value){alert('締切日時を入力してね');return}let old=data.find(x=>x.id===editing);let t={id:editing||String(Date.now())+Math.random().toString(36).slice(2),name:$('name').value.trim(),date:$('date').value,from:$('from').value,to:$('to').value,deadline:$('deadline').value,dueDate:$('dueDate').value,status:old?.status||'ready',started:old?.started||'',finished:old?.finished||''};if(!t.name)return;if(editing)data=data.map(x=>x.id===editing?t:x);else data.push(t);selected=t.id;resetForm();persist();show('list')});render();setInterval(()=>{if(!$('work').classList.contains('hidden'))render()},60000);</script></body></html>
